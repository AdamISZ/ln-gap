[workspace]
resolver = "2"
members = ["crates/btc", "crates/lamport", "crates/script32", "crates/channel", "crates/contract", "crates/party", "crates/harness", "crates/apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bitcoin = { version = "0.32", features = ["rand-std", "serde"] }
secp256k1 = { version = "0.29", features = ["rand", "global-context"] }
bitcoincore-rpc = "0.19"
sha2 = "0.10"
ripemd = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
hex = "0.4"
tempfile = "3"

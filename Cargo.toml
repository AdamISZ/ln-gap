[workspace]
resolver = "2"
members = ["crates/n4bit", "crates/btc", "crates/lamport", "crates/script32", "crates/ec-wots", "crates/channel", "crates/contract", "crates/harness", "crates/apps/*", "archive/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bitcoin = { version = "0.32", features = ["rand-std", "serde"] }
secp256k1 = { version = "0.29", features = ["rand", "global-context"] }
bitcoincore-rpc = "0.19"
sha2 = "0.10"
ripemd = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
hex = "0.4"
tempfile = "3"
tiny_http = "0.12"

# Dependencies (secp256k1, the hash crates) optimised even in debug builds:
# the harness is hash- and signature-bound, and secp256k1's C code takes
# the profile's opt level. Our own crates stay at debug for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2

# BitVMX-CPU with LN-GAP's patches: the `lngap` branch of a public fork,
# upstream 299009c plus bug fixes, the opt-in authenticated jump list and
# its fault injection.
[patch."https://github.com/FairgateLabs/BitVMX-CPU"]
emulator = { git = "https://github.com/AdamISZ/BitVMX-CPU", rev = "0b7d285fc5c7795d16fd58d380ff6ef25f2f0423" }
bitvmx-cpu-definitions = { git = "https://github.com/AdamISZ/BitVMX-CPU", rev = "0b7d285fc5c7795d16fd58d380ff6ef25f2f0423" }
bitcoin-script-riscv = { git = "https://github.com/AdamISZ/BitVMX-CPU", rev = "0b7d285fc5c7795d16fd58d380ff6ef25f2f0423" }

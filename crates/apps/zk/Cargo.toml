[package]
name = "lngap-zk"
version.workspace = true
edition.workspace = true
license.workspace = true

# ZKP verification as a venue game (DEMOS_PLAN.md section 3). Z1: one
# BitVMX terminal challenge as an LN-GAP disprove leaf over WOTS-parked
# nibbles. BitVMX-CPU's Script library is Apache-2.0 (its LICENSE file;
# the README says MIT), pinned to the commit measured in
# OFFCHAIN_BISECTION.md section 12.

[dependencies]
lngap-lamport = { path = "../../lamport" }
lngap-pos = { path = "../pos" }
lngap-channel = { path = "../../channel" }
bitcoin.workspace = true
anyhow.workspace = true
hex.workspace = true
blake3 = "1"
riscv-decode = "0.2.3"
bitcoin-script-functions = { git = "https://github.com/FairgateLabs/rust-bitcoin-script-functions", tag = "v0.6.0" }
bitcoin-script-riscv = { git = "https://github.com/FairgateLabs/BitVMX-CPU", rev = "299009c65e635327025ee13ffe1e1f1671bd0615" }
bitcoin-script-stack = { git = "https://github.com/FairgateLabs/rust-bitcoin-script-stack", tag = "v0.6.0" }

[dev-dependencies]
lngap-btc = { path = "../../btc" }
lngap-script32 = { path = "../../script32" }

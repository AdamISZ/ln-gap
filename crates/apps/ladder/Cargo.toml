[package]
name = "lngap-ladder"
version.workspace = true
edition.workspace = true
license.workspace = true

# LN-GAP v3's dispute ladder in BitVMX's own shape (JUMPLIST_PLAN.md, J2):
# each move signs only the values it posts, every rule re-reveals the
# signatures it reads, and the search is BitVMX's n-ary search with its
# equivocation challenges. BitVMX-CPU's Script library is Apache-2.0.

[dependencies]
lngap-lamport = { path = "../../lamport" }
lngap-channel = { path = "../../channel" }
lngap-btc = { path = "../../btc" }
lngap-zk = { path = "../zk" }
lngap-script32 = { path = "../../script32" }
bitcoin.workspace = true
anyhow.workspace = true
hex.workspace = true
blake3 = "1"
riscv-decode = "0.2.3"
bitcoin-script-functions = { git = "https://github.com/FairgateLabs/rust-bitcoin-script-functions", tag = "v0.6.0" }
bitcoin-script-riscv = { git = "https://github.com/FairgateLabs/BitVMX-CPU", rev = "299009c65e635327025ee13ffe1e1f1671bd0615" }
emulator = { git = "https://github.com/FairgateLabs/BitVMX-CPU", rev = "299009c65e635327025ee13ffe1e1f1671bd0615" }
bitvmx-cpu-definitions = { git = "https://github.com/FairgateLabs/BitVMX-CPU", rev = "299009c65e635327025ee13ffe1e1f1671bd0615" }
bitcoin-script-stack = { git = "https://github.com/FairgateLabs/rust-bitcoin-script-stack", tag = "v0.6.0" }

[dev-dependencies]
rand.workspace = true

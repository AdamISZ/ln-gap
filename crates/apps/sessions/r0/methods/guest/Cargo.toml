[package]
name = "withdraw"
version = "0.1.0"
edition = "2021"
license = "MIT"
# the toolchain of RISC Zero's pinned guest builder image
# (risczero/risc0-guest-builder:r0.1.88.0): the lockfile must resolve to
# versions that build with it
rust-version = "1.88"

[workspace]
# MSRV-aware resolution: dependency versions that build on rust-version
resolver = "3"

[dependencies]
lngap-r0-core = { path = "../../core" }
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std"] }
